version: '3.9'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: autocode_chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma 
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - autocode_net

networks:
  autocode_net:
    driver: bridge