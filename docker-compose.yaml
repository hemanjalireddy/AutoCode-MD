version: '3.9'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: autocode_chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    networks:
      - app_network
    
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=autocode
    ports:
      - "5432:5432"
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: autocode_backend
    ports:
      - "8080:8000"
    env_file: .env
    volumes:
      - .:/app
    command: uvicorn src.backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - CHROMA_HOST=autocode_chroma  
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql://user:password@db:5432/autocode
    depends_on:
      - chromadb
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: autocode_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./src/frontend:/app/src/frontend
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: