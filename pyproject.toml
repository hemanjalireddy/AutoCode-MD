[project]
name = "autocode-md"
version = "0.1.0"
description = ""
authors = [
    {name = "hemanjalireddy",email = "43489240+hemanjalireddy@users.noreply.github.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-huggingface (>=1.2.0,<2.0.0)",
    "pypdf (>=6.5.0,<7.0.0)",
    "sentence-transformers (>=5.2.0,<6.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "chromadb (>=1.4.0,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "streamlit (>=1.52.2,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "python-multipart (>=0.0.21,<0.0.22)",
    "requests (>=2.32.5,<3.0.0)",
    "groq (>=1.0.0,<2.0.0)",
    "instructor (>=1.13.0,<2.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "alembic (>=1.18.0,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
isort = "^7.0.0"
ruff = "^0.14.10"
mypy = "^1.19.1"


[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"

